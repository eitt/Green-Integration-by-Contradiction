ne","children":[{"content":"Negotiations began in 1999; distinguish negotiation conclusion, political agreement, and implementation.","children":[],"payload":{"tag":"li","lines":"254,255"}},{"content":"Negotiations concluded in 2019.","children":[],"payload":{"tag":"li","lines":"255,256"}},{"content":"The parties announced a political agreement with additional sustainability commitments on 6 December 2024.","children":[],"payload":{"tag":"li","lines":"256,257"}},{"content":"The interim trade instrument was provisionally applied from 1 May 2026; recheck legal status before submission.","children":[],"payload":{"tag":"li","lines":"257,258"}},{"content":"<a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/mercosur/eu-mercosur-agreement/factsheet-eu-mercosur-partnership-agreement_en\">European Commission EU&#x2013;Mercosur factsheet</a>","children":[],"payload":{"tag":"li","lines":"258,260"}}],"payload":{"tag":"li","lines":"253,260"}}],"payload":{"tag":"h3","lines":"239,240"}},{"content":"4.2 Sustainability chapter analysis","children":[{"content":"Trade and Sustainable Development chapters as value-based but enforcement-weak models.","children":[],"payload":{"tag":"li","lines":"262,263"}},{"content":"Sustainability commitments without robust monitoring and sanctions mechanisms tend to have limited impact on environmental protection and labour rights (Harrison &amp; Paulini, 2024).","children":[],"payload":{"tag":"li","lines":"263,264"}},{"content":"<a href=\"https://doi.org/10.1093/jiel/jgae044\">Harrison &amp; Paulini (2024), Journal of International Economic Law</a>","children":[],"payload":{"tag":"li","lines":"264,265"}},{"content":"Assess:","children":[{"content":"commitments;","children":[],"payload":{"tag":"li","lines":"266,267"}},{"content":"monitoring;","children":[],"payload":{"tag":"li","lines":"267,268"}},{"content":"dispute settlement;","children":[],"payload":{"tag":"li","lines":"268,269"}},{"content":"sanctions;","children":[],"payload":{"tag":"li","lines":"269,270"}},{"content":"civil-society participation.","children":[],"payload":{"tag":"li","lines":"270,271"}}],"payload":{"tag":"li","lines":"265,271"}},{"content":"Comparative enforcement problem","children":[{"content":"Environmental clauses may exist formally while remaining difficult to apply when indicators are divergent or contested.","children":[],"payload":{"tag":"li","lines":"272,273"}},{"content":"The enforcement gap is visible where deforestation datasets produce incompatible baselines (Olech et al., 2025).","children":[],"payload":{"tag":"li","lines":"273,274"}}],"payload":{"tag":"li","lines":"271,274"}},{"content":"Do not treat &quot;soft&quot; enforcement as automatically ineffective; test its effects against monitoring records, committee activity, and stakeholder outcomes.","children":[],"payload":{"tag":"li","lines":"274,275"}},{"content":"Update to the earlier formulation","children":[{"content":"The 2024 political package presents the Paris Agreement as an essential element and adds language on deforestation.","children":[],"payload":{"tag":"li","lines":"276,277"}},{"content":"Distinguish formal legal ambition from operational enforceability, rather than describing the Mercosur text simply as non-binding.","children":[],"payload":{"tag":"li","lines":"277,278"}},{"content":"Identify the formal consultation and independent expert-panel procedure.","children":[],"payload":{"tag":"li","lines":"278,279"}},{"content":"Ask what remains unresolved: domestic implementation, evidence-sharing, finance, participation, and consequences for non-compliance.","children":[],"payload":{"tag":"li","lines":"279,280"}},{"content":"<a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/mercosur/eu-mercosur-agreement/factsheet-eu-mercosur-partnership-agreement-trade-and-sustainable-development_en\">EU&#x2013;Mercosur sustainability factsheet</a>","children":[],"payload":{"tag":"li","lines":"280,282"}}],"payload":{"tag":"li","lines":"275,282"}}],"payload":{"tag":"h3","lines":"260,261"}},{"content":"4.3 Deforestation and land-use politics","children":[{"content":"EUDR as a controversial external factor.","children":[],"payload":{"tag":"li","lines":"284,285"}},{"content":"[Identify commodity sectors]","children":[],"payload":{"tag":"li","lines":"285,286"}},{"content":"[Map land-use change]","children":[],"payload":{"tag":"li","lines":"286,287"}},{"content":"[Identify Indigenous, rural, and local actors]","children":[],"payload":{"tag":"li","lines":"287,288"}},{"content":"Fuchs et al. (2024) identify loopholes and displacement risks in the interaction between the EUDR and EU-Mercosur; do not attribute the phrase &quot;situation of dependence&quot; to this article.","children":[],"payload":{"tag":"li","lines":"288,289"}},{"content":"<a href=\"https://doi.org/10.1088/1748-9326/ad69ab\">Fuchs et al. (2024), Environmental Research Letters</a>","children":[],"payload":{"tag":"li","lines":"289,290"}},{"content":"Land-use governance may be mixed rather than uniformly negative.","children":[{"content":"Market access can increase production pressures.","children":[],"payload":{"tag":"li","lines":"291,292"}},{"content":"A stable TSD framework may still provide institutional pressure for legal enforcement and cooperation (Cesar de Oliveira et al., 2024).","children":[],"payload":{"tag":"li","lines":"292,293"}},{"content":"Compare formal cooperation with actual distribution of monitoring and compliance costs.","children":[],"payload":{"tag":"li","lines":"293,294"}}],"payload":{"tag":"li","lines":"290,294"}},{"content":"Complement with Colombian zero-deforestation agreements:","children":[{"content":"voluntary coordination can align incentives and norms;","children":[],"payload":{"tag":"li","lines":"295,296"}},{"content":"institutional coordination does not necessarily produce immediate forest-loss reductions (Ortiz et al., 2025).","children":[],"payload":{"tag":"li","lines":"296,298"}}],"payload":{"tag":"li","lines":"294,298"}}],"payload":{"tag":"h3","lines":"282,283"}},{"content":"4.4 Green Deal credibility crisis","children":[{"content":"[Identify relevant Green Deal commitments]","children":[],"payload":{"tag":"li","lines":"300,301"}},{"content":"[Assess tension between trade liberalisation and environmental safeguards]","children":[],"payload":{"tag":"li","lines":"301,302"}},{"content":"[Assess political responses in the EU and Mercosur]","children":[],"payload":{"tag":"li","lines":"302,303"}},{"content":"[Explain implications for EU credibility]","children":[],"payload":{"tag":"li","lines":"303,304"}},{"content":"Regulatory and competitive asymmetry","children":[{"content":"Mercosur producers may hold extensive advantages in bulk commodities because of lower factor costs and different regulatory conditions (Jarzebowski et al., 2026).","children":[],"payload":{"tag":"li","lines":"305,306"}},{"content":"Soybean crop-protection rules show how differences in active substances and residue limits can create competitive asymmetries (Stra&#x17c;y&#x144;ski et al., 2026; verify spelling and final publication details).","children":[],"payload":{"tag":"li","lines":"306,307"}},{"content":"Ask whether EU standards are environmental safeguards, competitive regulation, or both.","children":[],"payload":{"tag":"li","lines":"307,308"}}],"payload":{"tag":"li","lines":"304,308"}},{"content":"The Green Deal increases external leverage and internal contestation simultaneously.","children":[],"payload":{"tag":"li","lines":"308,309"}},{"content":"Mercosur joins agricultural access, forests, and climate politics; the dispute concerns whether market integration and ecological transformation can share one instrument.","children":[],"payload":{"tag":"li","lines":"309,311"}}],"payload":{"tag":"h3","lines":"298,299"}},{"content":"4.5 Interim case finding","children":[{"content":"[Add empirically grounded finding]","children":[],"payload":{"tag":"li","lines":"313,314"}},{"content":"[Link finding to externalisation]","children":[],"payload":{"tag":"li","lines":"314,315"}},{"content":"[Link finding to legitimacy device thesis]","children":[],"payload":{"tag":"li","lines":"315,317"}}],"payload":{"tag":"h3","lines":"311,312"}}],"payload":{"tag":"h2","lines":"237,238"}},{"content":"5. Cross-case analysis &#x2014; 1,200&#x2013;1,500 words","children":[{"content":"5.1 Asymmetric greening","children":[{"content":"Develop the argument comparatively across three dimensions:","children":[{"content":"regulatory asymmetry;","children":[],"payload":{"tag":"li","lines":"322,323"}},{"content":"procedural asymmetry;","children":[],"payload":{"tag":"li","lines":"323,324"}},{"content":"distributional asymmetry.","children":[],"payload":{"tag":"li","lines":"324,325"}}],"payload":{"tag":"li","lines":"321,325"}},{"content":"Ask who defines the standard and who bears implementation costs.","children":[],"payload":{"tag":"li","lines":"325,326"}},{"content":"Compare depoliticised Andean governance with contested Mercosur governance.","children":[],"payload":{"tag":"li","lines":"326,327"}},{"content":"Compare mechanisms, not only outcomes:","children":[{"content":"rule production: EU institutions define or frame standards;","children":[],"payload":{"tag":"li","lines":"328,329"}},{"content":"implementation: firms, committees, competent authorities, and producers operationalise them;","children":[],"payload":{"tag":"li","lines":"329,330"}},{"content":"enforcement: sanctions, reputational pressure, dialogue, and market exclusion;","children":[],"payload":{"tag":"li","lines":"330,331"}},{"content":"distribution: costs and benefits fall unevenly across blocs and within sectors.","children":[],"payload":{"tag":"li","lines":"331,332"}}],"payload":{"tag":"li","lines":"327,332"}},{"content":"Comparative finding:","children":[{"content":"greener language, architecture, and public justification can coexist with uncertain transformation of extractive export models;","children":[],"payload":{"tag":"li","lines":"333,334"}},{"content":"the EU can demand compliance more readily than it supplies the finance and policy space needed for socially sustainable compliance.","children":[],"payload":{"tag":"li","lines":"334,336"}}],"payload":{"tag":"li","lines":"332,336"}}],"payload":{"tag":"h3","lines":"319,320"}},{"content":"5.2 EU Deforestation Regulation as parallel evidence","children":[{"content":"[Explain EUDR scope and requirements]","children":[],"payload":{"tag":"li","lines":"338,339"}},{"content":"[Connect EUDR to both agreements]","children":[],"payload":{"tag":"li","lines":"339,340"}},{"content":"[Assess complementarity and conflict]","children":[],"payload":{"tag":"li","lines":"340,341"}},{"content":"[Assess effects on smallholders, exporters, intermediaries, and corporate groups]","children":[],"payload":{"tag":"li","lines":"341,342"}},{"content":"[Distinguish documented impacts from inference]","children":[],"payload":{"tag":"li","lines":"342,343"}},{"content":"Legal mechanism","children":[{"content":"mandatory due diligence;","children":[],"payload":{"tag":"li","lines":"344,345"}},{"content":"information collection;","children":[],"payload":{"tag":"li","lines":"345,346"}},{"content":"risk assessment;","children":[],"payload":{"tag":"li","lines":"346,347"}},{"content":"risk mitigation;","children":[],"payload":{"tag":"li","lines":"347,348"}},{"content":"country benchmarking (Regulation (EU) 2023/1115).","children":[],"payload":{"tag":"li","lines":"348,349"}}],"payload":{"tag":"li","lines":"343,349"}},{"content":"Primary legal source","children":[{"content":"<a href=\"https://eur-lex.europa.eu/eli/reg/2023/1115/oj\">Consolidated EUDR text, Regulation (EU) 2023/1115</a>","children":[],"payload":{"tag":"li","lines":"350,351"}},{"content":"Relevant products cannot be placed on the EU market unless they are deforestation-free, produced according to relevant country legislation, and covered by a due-diligence statement.","children":[],"payload":{"tag":"li","lines":"351,352"}},{"content":"Due diligence requires information collection, risk assessment, and risk mitigation.","children":[],"payload":{"tag":"li","lines":"352,353"}}],"payload":{"tag":"li","lines":"349,353"}},{"content":"Current implementation note","children":[{"content":"The Commission&apos;s July 2026 update describes implementation at the end of 2026 and changes to product scope and information tools.","children":[],"payload":{"tag":"li","lines":"354,355"}},{"content":"<a href=\"https://environment.ec.europa.eu/news/commission-updates-product-scope-and-tools-support-eudr-2026-07-13_en\">Commission update on EUDR implementation tools, 13 July 2026</a>","children":[],"payload":{"tag":"li","lines":"355,356"}},{"content":"Recheck final application dates and product list immediately before submission.","children":[],"payload":{"tag":"li","lines":"356,357"}}],"payload":{"tag":"li","lines":"353,357"}},{"content":"Governance implication","children":[{"content":"EUDR is a direct market-access condition with extraterritorial effects.","children":[],"payload":{"tag":"li","lines":"358,359"}},{"content":"It differs from promotional TSD chapters because non-compliant products cannot be placed on the EU market.","children":[],"payload":{"tag":"li","lines":"359,360"}}],"payload":{"tag":"li","lines":"357,360"}},{"content":"EUDR shows a harder form of externalisation than promotional TSD chapters: autonomous EU law conditions market access without requiring a bilateral agreement.","children":[],"payload":{"tag":"li","lines":"360,361"}},{"content":"Delayed and amended application dates indicate contested implementation or institutional difficulty, not proof that the regulation has failed.","children":[],"payload":{"tag":"li","lines":"361,362"}},{"content":"Evidence to compare","children":[{"content":"legal design;","children":[],"payload":{"tag":"li","lines":"363,364"}},{"content":"operator responsibility;","children":[],"payload":{"tag":"li","lines":"364,365"}},{"content":"smallholder readiness;","children":[],"payload":{"tag":"li","lines":"365,366"}},{"content":"corporate concentration;","children":[],"payload":{"tag":"li","lines":"366,367"}},{"content":"local coordination and zero-deforestation agreements.","children":[],"payload":{"tag":"li","lines":"367,369"}}],"payload":{"tag":"li","lines":"362,369"}}],"payload":{"tag":"h3","lines":"336,337"}},{"content":"5.3 Legitimacy device thesis","children":[{"content":"State thesis directly.","children":[],"payload":{"tag":"li","lines":"371,372"}},{"content":"Sustainability provisions may:","children":[{"content":"improve environmental governance;","children":[],"payload":{"tag":"li","lines":"373,374"}},{"content":"legitimise EU external action;","children":[],"payload":{"tag":"li","lines":"374,375"}},{"content":"diffuse responsibility for implementation costs.","children":[],"payload":{"tag":"li","lines":"375,376"}}],"payload":{"tag":"li","lines":"372,376"}},{"content":"Identify conditions under which the thesis is supported.","children":[],"payload":{"tag":"li","lines":"376,377"}},{"content":"Address evidence against overclaiming.","children":[],"payload":{"tag":"li","lines":"377,378"}},{"content":"Observable indicators","children":[{"content":"activity of TSD committees;","children":[],"payload":{"tag":"li","lines":"379,380"}},{"content":"publication of reviews and meeting minutes;","children":[],"payload":{"tag":"li","lines":"380,381"}},{"content":"participation of domestic advisory groups;","children":[],"payload":{"tag":"li","lines":"381,382"}},{"content":"measurable changes in environmental or labour outcomes;","children":[],"payload":{"tag":"li","lines":"382,383"}},{"content":"access to remedy and enforcement.","children":[],"payload":{"tag":"li","lines":"383,384"}}],"payload":{"tag":"li","lines":"378,384"}},{"content":"Analytical test","children":[{"content":"If procedural activity expands while material outcomes and enforceability remain weak, the legitimacy-device interpretation gains support.","children":[],"payload":{"tag":"li","lines":"385,386"}},{"content":"If participation, enforcement, and outcomes improve together, the provisions should be treated as more than symbolic legitimation.","children":[],"payload":{"tag":"li","lines":"386,388"}}],"payload":{"tag":"li","lines":"384,388"}}],"payload":{"tag":"h3","lines":"369,370"}},{"content":"5.4 Comparative implications","children":[{"content":"[Implication for European integration studies]","children":[],"payload":{"tag":"li","lines":"390,391"}},{"content":"[Implication for EU trade architecture]","children":[],"payload":{"tag":"li","lines":"391,392"}},{"content":"[Implication for trade-environment scholarship]","children":[],"payload":{"tag":"li","lines":"392,393"}},{"content":"[Implication for Global South producers and communities]","children":[],"payload":{"tag":"li","lines":"393,394"}},{"content":"Fragmented integration regime:","children":[{"content":"negotiated agreements depend on consent and reciprocity;","children":[],"payload":{"tag":"li","lines":"395,396"}},{"content":"autonomous regulations impose internal-market conditions;","children":[],"payload":{"tag":"li","lines":"396,397"}},{"content":"evaluations generate knowledge;","children":[],"payload":{"tag":"li","lines":"397,398"}},{"content":"cooperation may build capacity without binding accountability.","children":[],"payload":{"tag":"li","lines":"398,399"}}],"payload":{"tag":"li","lines":"394,399"}},{"content":"Key mismatch: treaty and regulatory ambition can advance faster than data systems, finance, domestic administration, and enforcement capacity.","children":[],"payload":{"tag":"li","lines":"399,400"}},{"content":"Accountability can be dispersed across the Commission, Member States, partner governments, firms, certification bodies, and committees.","children":[],"payload":{"tag":"li","lines":"400,402"}}],"payload":{"tag":"h3","lines":"388,389"}}],"payload":{"tag":"h2","lines":"317,318"}},{"content":"6. Conclusion &#x2014; 500&#x2013;600 words","children":[{"content":"Restate the argument without repetition.","children":[],"payload":{"tag":"li","lines":"404,405"}},{"content":"Situate findings within the handbook&apos;s sustainability rollback theme.","children":[],"payload":{"tag":"li","lines":"405,406"}},{"content":"Implications for EU trade architecture:","children":[{"content":"[Institutional implication]","children":[],"payload":{"tag":"li","lines":"407,408"}},{"content":"[Regulatory implication]","children":[],"payload":{"tag":"li","lines":"408,409"}},{"content":"[Legitimacy implication]","children":[],"payload":{"tag":"li","lines":"409,410"}}],"payload":{"tag":"li","lines":"406,410"}},{"content":"Identify who bears decarbonisation costs in global value chains:","children":[{"content":"[Smallholders and producers]","children":[],"payload":{"tag":"li","lines":"411,412"}},{"content":"[Workers and communities]","children":[],"payload":{"tag":"li","lines":"412,413"}},{"content":"[Exporters and intermediaries]","children":[],"payload":{"tag":"li","lines":"413,414"}},{"content":"[Consumers and firms]","children":[],"payload":{"tag":"li","lines":"414,415"}}],"payload":{"tag":"li","lines":"410,415"}},{"content":"State limits and next research step.","children":[],"payload":{"tag":"li","lines":"415,416"}},{"content":"Do not claim that either agreement has caused a measured reduction in deforestation; identify mechanisms and conditions instead.","children":[],"payload":{"tag":"li","lines":"416,417"}},{"content":"Final concluding claim.","children":[],"payload":{"tag":"li","lines":"417,419"}}],"payload":{"tag":"h2","lines":"402,403"}},{"content":"References to verify","children":[{"content":"Claar (2022), p. 269.","children":[],"payload":{"tag":"li","lines":"421,422"}},{"content":"<a href=\"https://policy.trade.ec.europa.eu/analysis-and-assessment/ex-post-evaluations_en\">European Commission, ex post evaluation of n can concentrate market access.</td>\n<td>More than 75% of certified products are produced by ten corporate groups.</td>\n<td>Gr&#xf6;ne &amp; Snopkov (2025), Policy Brief No. 1, 11/2025</td>\n<td><a href=\"https://gssc.uni-koeln.de/en/research-1/associated-research-centers/competence-center-fair-trade-1/publications\">Publication record</a></td>\n<td>Supports corporate concentration argument.</td>\n</tr>\n<tr data-lines=\"456,457\">\n<td>EUDR compliance burdens smallholders.</td>\n<td>Costs may range from 10&#x2013;30% of smallholders&apos; income.</td>\n<td>Judijanto (2025)</td>\n<td><a href=\"https://theaspd.com/index.php/ijes/article/view/1283\">Article page</a> &#xb7; <a href=\"https://doi.org/10.64252/yqdekv79\">DOI</a></td>\n<td>Quantifies distributional pressure; verify before publication.</td>\n</tr>\n<tr data-lines=\"457,458\">\n<td>Andean implementation remains contested.</td>\n<td>Official evaluations and parliamentary scrutiny identify labour, participation and environmental-enforcement questions.</td>\n<td>European Commission (2022); European Parliament (2019)</td>\n<td><a href=\"https://policy.trade.ec.europa.eu/analysis-and-assessment/ex-post-evaluations_en\">Commission evaluation index</a></td>\n<td>Supports a cautious Case One finding without treating evaluation as causal proof.</td>\n</tr>\n<tr data-lines=\"458,459\">\n<td>TSD enforcement is weak.</td>\n<td>Sustainability commitments without robust monitoring and sanctions may have limited impact.</td>\n<td>Harrison &amp; Paulini (2024)</td>\n<td><a href=\"https://doi.org/10.1093/jiel/jgae044\">DOI</a></td>\n<td>Supports Case Two critique.</td>\n</tr>\n<tr data-lines=\"459,460\">\n<td>EUDR design may leave displacement risks.</td>\n<td>Product coverage, traceability and trade diversion can leave parts of the land-use system outside scrutiny.</td>\n<td>Fuchs et al. (2024)</td>\n<td><a href=\"https://doi.org/10.1088/1748-9326/ad69ab\">DOI</a></td>\n<td>Supports land-use and externalisation analysis without overstating the article&apos;s claim.</td>\n</tr>\n<tr data-lines=\"460,461\">\n<td>EUDR creates a direct market-access condition.</td>\n<td>Relevant products must be deforestation-free, legal in the country of production, and covered by a due-diligence statement.</td>\n<td>Regulation (EU) 2023/1115</td>\n<td><a href=\"https://eur-lex.europa.eu/eli/reg/2023/1115/oj\">EUR-Lex consolidated text</a></td>\n<td>Primary legal basis for the EUDR section.</td>\n</tr>\n<tr data-lines=\"461,462\">\n<td>EU&#x2013;Mercosur sustainability commitments changed in 2024.</td>\n<td>The parties added Paris Agreement and deforestation commitments on 6 December 2024.</td>\n<td>European Commission factsheet</td>\n<td><a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/mercosur/eu-mercosur-agreement/factsheet-eu-mercosur-partnership-agreement_en\">EU&#x2013;Mercosur factsheet</a></td>\n<td>Corrects the earlier simplified description of the agreement.</td>\n</tr>\n<tr data-lines=\"462,463\">\n<td>The Andean agreement has an official ex post evaluation record.</td>\n<td>The Commission publishes the evaluation and related implementation documents.</td>\n<td>European Commission</td>\n<td><a href=\"https://policy.trade.ec.europa.eu/analysis-and-assessment/ex-post-evaluations_en\">Ex post evaluations</a></td>\n<td>Supports methods and Case One evidence.</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"450,463"}}],"payload":{"tag":"h2","lines":"448,449"}},{"content":"Corrected source audit","children":[{"content":"Judijanto article page: <a href=\"https://theaspd.com/index.php/ijes/article/view/1283\">International Journal of Environmental Sciences, Vol. 11 No. 5s (2025)</a>","children":[{"content":"DOI: <a href=\"https://doi.org/10.64252/yqdekv79\">10.64252/yqdekv79</a>","children":[],"payload":{"tag":"li","lines":"467,468"}},{"content":"Publisher page confirms title, author, publication date, DOI,
