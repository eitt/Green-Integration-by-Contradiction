}}],"payload":{"tag":"li","lines":"252,257"}}],"payload":{"tag":"h3","lines":"246,247"}},{"content":"4.5 Interim case finding","children":[{"content":"[Add empirically grounded finding]","children":[],"payload":{"tag":"li","lines":"259,260"}},{"content":"[Link finding to externalisation]","children":[],"payload":{"tag":"li","lines":"260,261"}},{"content":"[Link finding to legitimacy device thesis]","children":[],"payload":{"tag":"li","lines":"261,263"}}],"payload":{"tag":"h3","lines":"257,258"}}],"payload":{"tag":"h2","lines":"189,190"}},{"content":"5. Cross-case analysis &#x2014; 1,200&#x2013;1,500 words","children":[{"content":"5.1 Asymmetric greening","children":[{"content":"Develop the argument comparatively across three dimensions:","children":[{"content":"regulatory asymmetry;","children":[],"payload":{"tag":"li","lines":"268,269"}},{"content":"procedural asymmetry;","children":[],"payload":{"tag":"li","lines":"269,270"}},{"content":"distributional asymmetry.","children":[],"payload":{"tag":"li","lines":"270,271"}}],"payload":{"tag":"li","lines":"267,271"}},{"content":"Ask who defines the standard and who bears implementation costs.","children":[],"payload":{"tag":"li","lines":"271,272"}},{"content":"Compare depoliticised Andean governance with contested Mercosur governance.","children":[],"payload":{"tag":"li","lines":"272,273"}},{"content":"Compare mechanisms, not only outcomes:","children":[{"content":"rule production: EU institutions define or frame standards;","children":[],"payload":{"tag":"li","lines":"274,275"}},{"content":"implementation: firms, committees, competent authorities, and producers operationalise them;","children":[],"payload":{"tag":"li","lines":"275,276"}},{"content":"enforcement: sanctions, reputational pressure, dialogue, and market exclusion;","children":[],"payload":{"tag":"li","lines":"276,277"}},{"content":"distribution: costs and benefits fall unevenly across blocs and within sectors.","children":[],"payload":{"tag":"li","lines":"277,279"}}],"payload":{"tag":"li","lines":"273,279"}}],"payload":{"tag":"h3","lines":"265,266"}},{"content":"5.2 EU Deforestation Regulation as parallel evidence","children":[{"content":"[Explain EUDR scope and requirements]","children":[],"payload":{"tag":"li","lines":"281,282"}},{"content":"[Connect EUDR to both agreements]","children":[],"payload":{"tag":"li","lines":"282,283"}},{"content":"[Assess complementarity and conflict]","children":[],"payload":{"tag":"li","lines":"283,284"}},{"content":"[Assess effects on smallholders, exporters, intermediaries, and corporate groups]","children":[],"payload":{"tag":"li","lines":"284,285"}},{"content":"[Distinguish documented impacts from inference]","children":[],"payload":{"tag":"li","lines":"285,286"}},{"content":"Legal mechanism","children":[{"content":"mandatory due diligence;","children":[],"payload":{"tag":"li","lines":"287,288"}},{"content":"information collection;","children":[],"payload":{"tag":"li","lines":"288,289"}},{"content":"risk assessment;","children":[],"payload":{"tag":"li","lines":"289,290"}},{"content":"risk mitigation;","children":[],"payload":{"tag":"li","lines":"290,291"}},{"content":"country benchmarking (Regulation (EU) 2023/1115).","children":[],"payload":{"tag":"li","lines":"291,292"}}],"payload":{"tag":"li","lines":"286,292"}},{"content":"Primary legal source","children":[{"content":"<a href=\"https://eur-lex.europa.eu/eli/reg/2023/1115/oj\">Consolidated EUDR text, Regulation (EU) 2023/1115</a>","children":[],"payload":{"tag":"li","lines":"293,294"}},{"content":"Relevant products cannot be placed on the EU market unless they are deforestation-free, produced according to relevant country legislation, and covered by a due-diligence statement.","children":[],"payload":{"tag":"li","lines":"294,295"}},{"content":"Due diligence requires information collection, risk assessment, and risk mitigation.","children":[],"payload":{"tag":"li","lines":"295,296"}}],"payload":{"tag":"li","lines":"292,296"}},{" "tag":"li","lines":"314,315"}},{"content":"legitimise EU external action;","children":[],"payload":{"tag":"li","lines":"315,316"}},{"content":"diffuse responsibility for implementation costs.","children":[],"payload":{"tag":"li","lines":"316,317"}}],"payload":{"tag":"li","lines":"313,317"}},{"content":"Identify conditions under which the thesis is supported.","children":[],"payload":{"tag":"li","lines":"317,318"}},{"content":"Address evidence against overclaiming.","children":[],"payload":{"tag":"li","lines":"318,319"}},{"content":"Observable indicators","children":[{"content":"activity of TSD committees;","children":[],"payload":{"tag":"li","lines":"320,321"}},{"content":"publication of reviews and meeting minutes;","children":[],"payload":{"tag":"li","lines":"321,322"}},{"content":"participation of domestic advisory groups;","children":[],"payload":{"tag":"li","lines":"322,323"}},{"content":"measurable changes in environmental or labour outcomes;","children":[],"payload":{"tag":"li","lines":"323,324"}},{"content":"access to remedy and enforcement.","children":[],"payload":{"tag":"li","lines":"324,325"}}],"payload":{"tag":"li","lines":"319,325"}},{"content":"Analytical test","children":[{"content":"If procedural activity expands while material outcomes and enforceability remain weak, the legitimacy-device interpretation gains support.","children":[],"payload":{"tag":"li","lines":"326,327"}},{"content":"If participation, enforcement, and outcomes improve together, the provisions should be treated as more than symbolic legitimation.","children":[],"payload":{"tag":"li","lines":"327,329"}}],"payload":{"tag":"li","lines":"325,329"}}],"payload":{"tag":"h3","lines":"310,311"}},{"content":"5.4 Comparative implications","children":[{"content":"[Implication for European integration studies]","children":[],"payload":{"tag":"li","lines":"331,332"}},{"content":"[Implication for EU trade architecture]","children":[],"payload":{"tag":"li","lines":"332,333"}},{"content":"[Implica /ex-post-evaluations_en\">European Commission, ex post evaluation of the EU&#x2013;Colombia/Ecuador/Peru Agreement</a>.","children":[],"payload":{"tag":"li","lines":"355,356"}},{"content":"Fuchs et al. (2024).","children":[],"payload":{"tag":"li","lines":"356,357"}},{"content":"Gr&#xf6;ne &amp; Snopkov (2025), Policy Brief No. 1, 11/2025.","children":[],"payload":{"tag":"li","lines":"357,358"}},{"content":"Harrison &amp; Paulini (2024).","children":[],"payload":{"tag":"li","lines":"358,359"}},{"content":"Judijanto (2025), International Journal of Environmental Sciences.","children":[],"payload":{"tag":"li","lines":"359,360"}},{"content":"Lavenex &amp; Schimmelfennig (2009), p. 805.","children":[],"payload":{"tag":"li","lines":"360,361"}},{"content":"<a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/andean-community/documents_en\">EU&#x2013;Andean Agreement primary documents</a>.","children":[],"payload":{"tag":"li","lines":"361,362"}},{"content":"<a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/mercosur/eu-mercosur-agreement\">EU&#x2013;Mercosur Agreement primary documents and factsheets</a>.","children":[],"payload":{"tag":"li","lines":"362,363"}},{"content":"<a href=\"https://eur-lex.europa.eu/eli/reg/2023/1115/oj\">EU Deforestation Regulation, Regulation (EU) 2023/1115</a>.","children":[],"payload":{"tag":"li","lines":"363,364"}},{"content":"<a href=\"https://doi.org/10.1093/oso/9780190088583.001.0001\">Bradford (2020), The Brussels Effect</a>.","children":[],"payload":{"tag":"li","lines":"364,365"}},{"content":"<a href=\"https://doi.org/10.1080/13501763.2015.1041411\">Damro (2015), Market Power Europe and new EU trade policies</a>.","children":[],"payload":{"tag":"li","lines":"365,366"}},{"content":"Damro (2025), Market Power Europe and economic security.","children":[],"payload":{"tag":"li","lines":"366,367"}},{"content":"<a href=\"https://doi.or lines=\"382,383\">\n<td>Boundaries are geographically localizable but not necessarily physical.</td>\n<td>EU governance boundaries are &quot;geographically localizable but not necessarily physical&quot;.</td>\n<td>Lavenex &amp; Schimmelfennig (2009), p. 805</td>\n<td><a href=\"https://archive-ouverte.unige.ch/unige:76475\">Archive ouverte</a></td>\n<td>Defines rule-based external governance.</td>\n</tr>\n<tr data-lines=\"383,384\">\n<td>Market size exports standards beyond formal territory.</td>\n<td>Boundaries regulate movement and governance between territorial organisations.</td>\n<td>Lavenex &amp; Schimmelfennig (2009), p. 805</td>\n<td><a href=\"https://archive-ouverte.unige.ch/unige:76475\">Archive ouverte</a></td>\n<td>Supports regulatory externalisation mechanism.</td>\n</tr>\n<tr data-lines=\"384,385\">\n<td>Green colonialism produces asymmetric burdens.</td>\n<td>Sustainability policies imposed by powerful actors can burden or disempower Global South communities.</td>\n<td>Claar (2022), p. 269</td>\n<td>[Add link]</td>\n<td>Defines critical lens.</td>\n</tr>\n<tr data-lines=\"385,386\">\n<td>Certification can concentrate market access.</td>\n<td>More than 75% of certified products are produced by ten corporate groups.</td>\n<td>Gr&#xf6;ne &amp; Snopkov (2025), Policy Brief No. 1, 11/2025</td>\n<td>[Add link]</td>\n<td>Supports corporate concentration argument.</td>\n</tr>\n<tr data-lines=\"386,387\">\n<td>EUDR compliance burdens smallholders.</td>\n<td>Costs may range from 10&#x2013;30% of smallholders&apos; income.</td>\n<td>Judijanto (2025)</td>\n<td><a href=\"https://www.theaspd.com/ijes.php\">International Journal of Environmental Sciences</a></td>\n<td>Quantifies distributional pressure; verify before publication.</td>\n</tr>\n<tr data-lines=\"387,388\">\n<td>Andean roadmap effectiveness is contested.</td>\n<td>Relaxing environmental standards calls the roadmap&apos;s effectiveness into question.</td>\n<td>European Commission (2022b), ex post evaluation</td>\n<td>[Add verified link]</td>\n<td>Supports Case One finding.</td>\n</tr>\n<tr data-lines=\"388,389\">\n<td>TSD enforcement is weak.</td>\n<td>Sustainability commitments without robust monitoring and sanctions may have limited impact.</td>\n<td>Harrison &amp; Paulini (2024)</td>\n<td>[Add verified link]</td>\n<td>Supports Case Two critique.</td>\n</tr>\n<tr data-lines=\"389,390\">\n<td>EUDR can reproduce dependence.</td>\n<td>Compliance requirements place the Southern Cone in a situation of dependence.</td>\n<td>Fuchs et al. (2024)</td>\n<td>[Add verified link]</td>\n<td>Supports land-use and externalisation analysis.</td>\n</tr>\n<tr data-lines=\"390,391\">\n<td>EUDR creates a direct market-access condition.</td>\n<td>Relevant products must be deforestation-free, legal in the country of production, and covered by a due-diligence statement.</td>\n<td>Regulation (EU) 2023/1115</td>\n<td><a href=\"https://eur-lex.europa.eu/eli/reg/2023/1115/oj\">EUR-Lex consolidated text</a></td>\n<td>Primary legal basis for the EUDR section.</td>\n</tr>\n<tr data-lines=\"391,392\">\n<td>EU&#x2013;Mercosur sustainability commitments changed in 2024.</td>\n<td>The parties added Paris Agreement and deforestation commitments on 6 December 2024.</td>\n<td>European Commission factsheet</td>\n<td><a href=\"https://policy.trade.ec.europa.eu/eu-trade-relationships-country-and-region/countries-and-regions/mercosur/eu-mercosur-agreement/factsheet-eu-mercosur-partnership-agreement_en\">EU&#x2013;Mercosur factsheet</a></td>\n<td>Corrects the earlier simplified description of the agreement.</td>\n</tr>\n<tr data-lines=\"392,393\">\n<td>The Andean agreement has an official ex post evaluation record.</td>\n<td>The Commission publishes the evaluation and related implementation documents.</td>\n<td>European Commission</td>\n<td><a href=\"https://policy.trade.ec.europa.eu/analysis-and-assessment/ex-post-evaluations_en\">Ex post evaluations</a></td>\n<td>Supports methods and Case One evidence.</
