<desc  id="timeline-desc">
	A seven-stage timeline showing the negotiating mandate, resumed talks, the 2019 trade agreement in principle, the 2020 sustainability assessment, adoption of the EU Deforestation Regulation, the 2024 political agreement, and signature and provisional application in 2026. An analytical panel links these events to integration by externalisation, asymmetric greening and sustainability as a legitimacy device.
	</desc>
