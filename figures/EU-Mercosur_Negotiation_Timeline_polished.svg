<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" version="1.1" baseProfile="full">
  <title id="timeline-title">EU–Mercosur: negotiation, green commitments and implementation, 1999–2026</title>
  <desc id="timeline-desc">A seven-stage timeline showing the negotiating mandate, resumed talks, the 2019 trade agreement in principle, the 2020 sustainability assessment, adoption of the EU Deforestation Regulation, the 2024 political agreement, and signature and provisional application in 2026. An analytical panel links these events to integration by externalisation, asymmetric greening and sustainability as a legitimacy device.</desc>
  <defs>
    <pattern id="trade-hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#202020" />
      <path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#777777" stroke-width="1.6" />
    </pattern>
    <pattern id="regulation-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#3A3A3A" />
      <circle cx="2.5" cy="2.5" r="1.35" fill="#BDBDBD" />
      <circle cx="7.5" cy="7.5" r="1.35" fill="#BDBDBD" />
    </pattern>
    <pattern id="tension-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#303030" />
      <path d="M0,0 H10 M0,5 H10 M0,0 V10 M5,0 V10" stroke="#929292" stroke-width="0.9" />
    </pattern>
  </defs>
  <rect width="1800" height="1200" fill="#FFFFFF" />
  <text x="60" y="72" font-family="Arial, Helvetica, sans-serif" font-size="40px" font-weight="700" fill="#111111">EU–Mercosur: negotiation, green commitments and implementation, 1999–2026</text>
  <text x="60" y="112" font-family="Arial, Helvetica, sans-serif" font-size="24px" font-weight="400" fill="#444444">Selected milestones for <tspan font-style="italic">Green Integration by Contradiction</tspan>
  </text>
  <g transform="translate(1185,106)">
    <circle cx="0" cy="0" r="7" fill="url(#trade-hatch)" />
    <text x="14" y="6" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#333333">trade process</text>
    <circle cx="170" cy="0" r="7" fill="url(#regulation-dots)" />
    <text x="184" y="6" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#333333">EU regulation</text>
    <circle cx="345" cy="0" r="7" fill="url(#tension-grid)" />
    <text x="359" y="6" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#333333">contested implementation</text>
  </g>
  <text x="60" y="151" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" letter-spacing="1.8px" fill="#444444">SELECTED MILESTONES</text>
  <line x1="95" y1="460" x2="1722" y2="460" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" fill="none" />
  <polygon points="1718,424 1785,460 1718,496" fill="#1A1A1A" stroke="none" />
  <line x1="140" y1="397" x2="140" y2="438" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="30" y="172" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="30" y="172" width="220" height="44" rx="14" fill="url(#trade-hatch)" />
    <rect x="30" y="200" width="220" height="16" fill="url(#trade-hatch)" />
    <text x="48" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">1999–2000</text>
    <text x="48" y="247" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="48" dy="0">Mandate and</tspan>
      <tspan x="48" dy="27">opening talks</tspan>
    </text>
    <text x="48" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="48" dy="0">A 1999 Council mandate</tspan>
      <tspan x="48" dy="22">led to negotiations in</tspan>
      <tspan x="48" dy="22">2000 on trade, political</tspan>
      <tspan x="48" dy="22">dialogue and cooperation.</tspan>
    </text>
  </g>
  <circle cx="140" cy="460" r="17" fill="url(#trade-hatch)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="400" y1="482" x2="400" y2="535" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="290" y="535" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="290" y="535" width="220" height="44" rx="14" fill="url(#trade-hatch)" />
    <rect x="290" y="563" width="220" height="16" fill="url(#trade-hatch)" />
    <text x="308" y="565" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2004–2010</text>
    <text x="308" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="308" dy="0">Pause, then</tspan>
      <tspan x="308" dy="27">renewed talks</tspan>
    </text>
    <text x="308" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="308" dy="0">Talks were suspended</tspan>
      <tspan x="308" dy="22">over agriculture, services</tspan>
      <tspan x="308" dy="22">and public procurement,</tspan>
      <tspan x="308" dy="22">then resumed in May 2010.</tspan>
    </text>
  </g>
  <circle cx="400" cy="460" r="17" fill="url(#trade-hatch)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="660" y1="397" x2="660" y2="438" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="550" y="172" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="550" y="172" width="220" height="44" rx="14" fill="url(#tension-grid)" />
    <rect x="550" y="200" width="220" height="16" fill="url(#tension-grid)" />
    <text x="568" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2019</text>
    <text x="568" y="247" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="568" dy="0">Trade deal agreed</tspan>
      <tspan x="568" dy="27">in principle</tspan>
    </text>
    <text x="568" y="306" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="568" dy="0">The trade pillar closed on</tspan>
      <tspan x="568" dy="21">29 June. The European</tspan>
      <tspan x="568" dy="21">Green Deal followed in</tspan>
      <tspan x="568" dy="21">December, while Amazon</tspan>
      <tspan x="568" dy="21">forest loss tested credibility.</tspan>
    </text>
  </g>
  <circle cx="660" cy="460" r="17" fill="url(#tension-grid)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="920" y1="482" x2="920" y2="535" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="810" y="535" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="810" y="535" width="220" height="44" rx="14" fill="url(#trade-hatch)" />
    <rect x="810" y="563" width="220" height="16" fill="url(#trade-hatch)" />
    <text x="828" y="565" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2020</text>
    <text x="828" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="828" dy="0">Sustainability</tspan>
      <tspan x="828" dy="27">assessment</tspan>
    </text>
    <text x="828" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="828" dy="0">The Commission published</tspan>
      <tspan x="828" dy="22">its draft SIA. Its scenarios</tspan>
      <tspan x="828" dy="22">projected possible effects;</tspan>
      <tspan x="828" dy="22">they were not ex post evidence.</tspan>
    </text>
  </g>
  <circle cx="920" cy="460" r="17" fill="url(#trade-hatch)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="1180" y1="397" x2="1180" y2="438" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="1070" y="172" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="1070" y="172" width="220" height="44" rx="14" fill="url(#regulation-dots)" />
    <rect x="1070" y="200" width="220" height="16" fill="url(#regulation-dots)" />
    <text x="1088" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2023</text>
    <text x="1088" y="247" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="1088" dy="0">EUDR adopted</tspan>
    </text>
    <text x="1088" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="1088" dy="0">Regulation (EU) 2023/1115</tspan>
      <tspan x="1088" dy="22">made deforestation-free</tspan>
      <tspan x="1088" dy="22">production and due diligence</tspan>
      <tspan x="1088" dy="22">conditions of EU market</tspan>
      <tspan x="1088" dy="22">access for covered products.</tspan>
    </text>
  </g>
  <circle cx="1180" cy="460" r="17" fill="url(#regulation-dots)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="1440" y1="482" x2="1440" y2="535" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="1330" y="535" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="1330" y="535" width="220" height="44" rx="14" fill="url(#tension-grid)" />
    <rect x="1330" y="563" width="220" height="16" fill="url(#tension-grid)" />
    <text x="1348" y="565" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2024</text>
    <text x="1348" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="1348" dy="0">Political agreement</tspan>
      <tspan x="1348" dy="27">reached</tspan>
    </text>
    <text x="1348" y="677" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="1348" dy="0">On 6 December, the parties</tspan>
      <tspan x="1348" dy="22">added stronger Paris and</tspan>
      <tspan x="1348" dy="22">deforestation commitments.</tspan>
      <tspan x="1348" dy="22">Implementation remained</tspan>
      <tspan x="1348" dy="22">politically contested.</tspan>
    </text>
  </g>
  <circle cx="1440" cy="460" r="17" fill="url(#tension-grid)" stroke="#1A1A1A" stroke-width="4" />
  <line x1="1700" y1="397" x2="1700" y2="438" stroke="#777777" stroke-width="3" fill="none" />
  <g>
    <rect x="1570" y="172" width="220" height="225" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="1570" y="172" width="220" height="44" rx="14" fill="url(#trade-hatch)" />
    <rect x="1570" y="200" width="220" height="16" fill="url(#trade-hatch)" />
    <text x="1588" y="202" font-family="Arial, Helvetica, sans-serif" font-size="25px" font-weight="700" fill="#FFFFFF">2026</text>
    <text x="1588" y="247" font-family="Arial, Helvetica, sans-serif" font-size="23px" font-weight="700" fill="#111111">
      <tspan x="1588" dy="0">Signed and applied</tspan>
      <tspan x="1588" dy="27">provisionally</tspan>
    </text>
    <text x="1588" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16px" font-weight="400" fill="#292929">
      <tspan x="1588" dy="0">The EMPA and interim Trade</tspan>
      <tspan x="1588" dy="22">Agreement were signed on</tspan>
      <tspan x="1588" dy="22">17 January. The interim deal</tspan>
      <tspan x="1588" dy="22">applied from 1 May.</tspan>
    </text>
  </g>
  <circle cx="1700" cy="460" r="17" fill="url(#trade-hatch)" stroke="#1A1A1A" stroke-width="4" />
  <rect x="60" y="807" width="1680" height="52" rx="12" fill="url(#trade-hatch)" />
  <text x="900" y="841" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22px" font-weight="600" fill="#FFFFFF">Greener legal text does not, by itself, produce ecological transformation.</text>
  <text x="60" y="902" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="700" letter-spacing="1.8px" fill="#444444">ANALYTICAL READING</text>
  <g>
    <rect x="60" y="923" width="520" height="170" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="60" y="923" width="8" height="170" rx="4" fill="url(#regulation-dots)" />
    <text x="88" y="960" font-family="Arial, Helvetica, sans-serif" font-size="24px" font-weight="700" fill="#111111">Integration by externalisation</text>
    <text x="88" y="997" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#292929">
      <tspan x="88" dy="0">EU market access carries rules, reporting duties and</tspan>
      <tspan x="88" dy="25">environmental standards beyond the Union’s territory.</tspan>
      <tspan x="88" dy="25">Trade agreements and the EUDR use different legal routes.</tspan>
    </text>
  </g>
  <g>
    <rect x="640" y="923" width="520" height="170" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="640" y="923" width="8" height="170" rx="4" fill="url(#tension-grid)" />
    <text x="668" y="960" font-family="Arial, Helvetica, sans-serif" font-size="24px" font-weight="700" fill="#111111">Asymmetric greening</text>
    <text x="668" y="997" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#292929">
      <tspan x="668" dy="0">Regulatory ambition can rise faster than finance, data</tspan>
      <tspan x="668" dy="25">systems and implementation capacity. Compliance costs</tspan>
      <tspan x="668" dy="25">are therefore distributed unevenly.</tspan>
    </text>
  </g>
  <g>
    <rect x="1220" y="923" width="520" height="170" rx="14" fill="#FFFFFF" stroke="#B8B8B8" stroke-width="1.5" />
    <rect x="1220" y="923" width="8" height="170" rx="4" fill="url(#trade-hatch)" />
    <text x="1248" y="960" font-family="Arial, Helvetica, sans-serif" font-size="24px" font-weight="700" fill="#111111">Sustainability as a legitimacy device</text>
    <text x="1248" y="997" font-family="Arial, Helvetica, sans-serif" font-size="18px" font-weight="400" fill="#292929">
      <tspan x="1248" dy="0">Environmental provisions can organise cooperation and</tspan>
      <tspan x="1248" dy="25">justify market opening without settling who funds</tspan>
      <tspan x="1248" dy="25">implementation or bears adjustment costs.</tspan>
    </text>
  </g>
  <text x="60" y="1135" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#444444">
    Sources:
    <tspan font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#111111" text-decoration="underline">European Parliament, negotiation history</tspan>
    <tspan> · </tspan>
    <tspan font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#111111" text-decoration="underline">European Commission, agreement text and chronology</tspan>
    <tspan> · </tspan>
    <tspan font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#111111" text-decoration="underline">Regulation (EU) 2023/1115</tspan>
  </text>
  <text x="60" y="1164" font-family="Arial, Helvetica, sans-serif" font-size="14px" font-weight="400" fill="#444444">Context and framing: Albertoni and Schlegelmilch (2026); Cesar de Oliveira et al. (2024); Lavenex and Schimmelfennig (2009); Damro (2015); Harrison and Paulini (2024).</text>
</svg>